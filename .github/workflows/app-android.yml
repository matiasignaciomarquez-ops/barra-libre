      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-v${{ github.run_number }}" build/barra-libre.apk \
            --repo "${{ github.repository }}" \
            --title "App Android ${{ github.run_number }}" \
            --notes "App de Android de Barra Libre con Health Connect. Descargá barra-libre.apk e instalala en el teléfono." \
            --latest
