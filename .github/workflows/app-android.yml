# Compila la app de Android de Barra Libre (con Health Connect) y la publica en "Releases".
# Se ejecuta sola cuando se sube o cambia este archivo, o a mano desde la pestaña Actions.
# La app abre la misma web de siempre: las actualizaciones de la web llegan solas, sin reinstalar.
name: App Android

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/app-android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Crear el proyecto de Android
        run: |
          mkdir -p build && cd build
          npm init -y > /dev/null
          npm install @capacitor/core@8.5.3 @capacitor/cli@8.5.3 @capacitor/android@8.5.3 @capgo/capacitor-health@8.11.8 \
            @capacitor-community/background-geolocation@1.2.26 @capacitor/local-notifications@8.3.1 @capacitor/app-launcher@8.0.1 \
            @capacitor/filesystem@8.1.3 @capacitor/share@8.0.2
          mkdir -p www
          cat > www/index.html <<'HTML'
          <!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barra Libre</title></head>
          <body style="background:#111317;color:#ecebe6;font-family:sans-serif;padding:24px"><h2>Barra Libre</h2><p>Abrí la app con internet la primera vez.</p>
          <p><a style="color:#ef5a4c" href="https://matiasignaciomarquez-ops.github.io/barra-libre/">Reintentar</a></p></body></html>
          HTML
          cat > www/privacypolicy.html <<'HTML'
          <!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Barra Libre · Privacidad</title>
          <style>body{font:16px/1.55 system-ui,-apple-system,sans-serif;max-width:640px;margin:0 auto;padding:20px;color:#16181c;background:#f3f2ee}h1{font-size:24px}h2{font-size:18px;margin-top:24px}@media(prefers-color-scheme:dark){body{background:#111317;color:#ecebe6}}</style></head><body>
          <h1>Barra Libre: política de privacidad</h1>
          <p>Barra Libre es una app personal y gratuita de entrenamiento. No tiene publicidad, no vende datos y no los comparte con terceros.</p>
          <h2>Datos de salud (Health Connect)</h2>
          <p>Si das permiso, la app de Android lee de Health Connect: pasos, frecuencia cardíaca, frecuencia cardíaca en reposo, sueño, peso, grasa corporal, altura, VO2máx y entrenamientos. Solo se leen; la app no escribe datos en Health Connect.</p>
          <p>Se usan únicamente para mostrarte tus estadísticas dentro de Barra Libre (pasos por día, sueño, zonas de frecuencia cardíaca y carga de entrenamiento).</p>
          <h2>Ubicación (GPS)</h2>
          <p>Solo cuando tocás "Grabar" en Cardio, la app usa la ubicación del teléfono para dibujar el recorrido de esa salida, también con la pantalla apagada (vas a ver un aviso fijo mientras graba). Al terminar se deja de usar. El recorrido se guarda en tu cuenta y solo lo ves vos. Para corregir la altura, las coordenadas del recorrido se envían sin tu nombre al servicio público Open-Meteo.</p>
          <h2>Dónde se guardan</h2>
          <p>Los resúmenes se guardan en tu cuenta personal de Barra Libre (Google Firebase), protegida por tu usuario: solo vos podés leerlos. Si usás la app sin cuenta, quedan solo en tu teléfono.</p>
          <h2>Cómo quitar el acceso o borrar datos</h2>
          <p>Podés quitar los permisos en cualquier momento desde Ajustes → Health Connect → Permisos de apps → Barra Libre. Podés exportar o borrar tus registros desde el menú de la app, o borrar tu perfil.</p>
          <p>Contacto: el dueño de la app (uso personal y familiar).</p>
          </body></html>

          HTML
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "ar.barralibre.app",
            "appName": "Barra Libre",
            "webDir": "www",
            "server": { "url": "https://matiasignaciomarquez-ops.github.io/barra-libre/" },
            "android": { "backgroundColor": "#111317", "useLegacyBridge": true }
          }
          JSON
          npx cap add android
          npx cap sync android
          # Health Connect pide Android 8 o más nuevo
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 26/' android/variables.gradle
          # permiso para leer más de 30 días de historial
          sed -i 's#<application#<uses-permission android:name="android.permission.health.READ_HEALTH_DATA_HISTORY" />\n    <application#' android/app/src/main/AndroidManifest.xml
          # apps de relojes que Barra Libre puede abrir para forzar la sincronización (Android 11 o más nuevo)
          sed -i 's#<application#<queries><package android:name="com.mi.health" /><package android:name="com.xiaomi.wearable" /><package android:name="com.garmin.android.apps.connectmobile" /><package android:name="com.sec.android.app.shealth" /><package android:name="com.huami.watch.hmwatchmanager" /><package android:name="com.xiaomi.hm.health" /><package android:name="com.huawei.health" /><package android:name="com.fitbit.FitbitMobile" /></queries>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -c "queries" android/app/src/main/AndroidManifest.xml
          # número de versión = número de compilación
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          # ícono y pantalla de inicio de Barra Libre
          mkdir -p assets
          cp ../icons/icon-512.png assets/icon-only.png || true
          npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#111317' --iconBackgroundColorDark '#111317' --splashBackgroundColor '#111317' --splashBackgroundColorDark '#111317' || echo "Sin ícono personalizado"
          if [ -f ../icons/icon-512.png ]; then
            convert -size 1080x1920 xc:'#111317' ../icons/icon-512.png -gravity center -geometry 360x360+0+0 -composite splash.png || true
            [ -f splash.png ] && find android/app/src/main/res -name 'splash.png' -exec cp splash.png {} \; || true
          fi

      - name: Compilar
        run: |
          cd build/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

